[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agree-phrase-asr"
version = "0.2.0"
description = "Symmetric Bidirectional Agreement-Anchored Phrase Recombination for Frozen Multilingual ASR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.0",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
